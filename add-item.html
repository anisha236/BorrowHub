<!DOCTYPE html>
<html>

<head>
    <title>BorrowHub - Add Item</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <h2>BorrowHub</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="browse.html">Browse Items</a>
            <a href="add-item.html">Add Item</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <h1>Add an Item</h1>

    <p>List an item that you are willing to lend.</p>

    <input type="text" placeholder="Enter item name">
    <input type="text" placeholder="Enter item location">
    <select>
    <option value="">Select category</option>
    <option value="Books">📚 Books</option>
    <option value="Tools">🔧 Tools</option>
    <option value="Electronics">💻 Electronics</option>
    <option value="Others">🎒 Others</option>
</select>

    <textarea placeholder="Enter description"></textarea>
    <input type="file" accept="image/*">
    <select>
    <option value="">Select availability</option>
    <option value="available">Available</option>
    <option value="not-available">Not Available</option>
</select>
<input type="number" placeholder="Maximum borrowing days" min="1">
<select>
    <option value="">Preferred contact method</option>
    <option value="email">📧 Email</option>
    <option value="phone">📱 Phone</option>
</select>
<select>
    <option value="">Select item condition</option>
    <option value="new">✨ New</option>
    <option value="good">👍 Good</option>
    <option value="used">♻️ Used</option>
</select>
    <button>Add Item</button>

</body>

</html>>
